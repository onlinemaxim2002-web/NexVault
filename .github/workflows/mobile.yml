name: Android app

on:
  push:
    paths: ["mobile/**", ".github/workflows/mobile.yml"]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      # Generate all Android launcher icon densities from the NexVault SVG artwork.
      - name: Generate NexVault launcher icons
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin
          set -e
          for spec in "mdpi 48" "hdpi 72" "xhdpi 96" "xxhdpi 144" "xxxhdpi 192"; do
            set -- $spec
            density="$1"
            size="$2"
            mkdir -p "android/app/src/main/res/mipmap-$density"
            rsvg-convert -w "$size" -h "$size" assets/nexvault_icon.svg \
              -o "android/app/src/main/res/mipmap-$density/ic_launcher.png"
          done

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.6"
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      # Same code and package name: either APK can update the other.
      - name: Build normal APK
        run: |
          flutter build apk --release --flavor normal
          mkdir -p ../dist
          cp build/app/outputs/flutter-apk/app-normal-release.apk ../dist/NexVault.apk

      - name: Build ads APK (Meta)
        run: |
          flutter build apk --release --flavor ads \
            --dart-define=APK_REFERRER="utm_source=meta&utm_medium=paid_social&utm_campaign=apk_download"
          cp build/app/outputs/flutter-apk/app-ads-release.apk ../dist/NexVault-ads.apk

      - uses: actions/upload-artifact@v4
        with:
          name: NexVault-apks
          path: |
            dist/*.apk
          retention-days: 30
